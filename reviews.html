<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leave a Review!</title>
  <link href="favicon.ico" rel="icon" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOoZ_Eyy_p1gyO-1k8wJPe11g2qkFEaQE",
      authDomain: "cat-sitting-reviews-data.firebaseapp.com",
      projectId: "cat-sitting-reviews-data",
      storageBucket: "cat-sitting-reviews-data.firebasestorage.app",
      messagingSenderId: "207029228993",
      appId: "1:207029228993:web:c3f822c187299641d64b40",
      measurementId: "G-NVF8GCTSSP"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let reviews = [];

    async function loadReviews() {
      const reviewList = document.getElementById('review-list');
      const avgRatingEl = document.getElementById('average-rating');
      reviewList.innerHTML = '';
      avgRatingEl.textContent = '';

      // loading indicator
      const loadingEl = document.createElement('div');
      loadingEl.className = 'loading';
      loadingEl.textContent = 'Loading reviews...';
      reviewList.appendChild(loadingEl);

      const snapshot = await getDocs(collection(db, "reviews"));
      reviews = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        reviews.push({
          author: data.author,
          rating: data.rating,
          text: data.text,
          createdAt: data.createdAt ? data.createdAt.toMillis() : 0
        });
      });

      renderReviews();
    }

    function renderReviews() {
      const reviewList = document.getElementById('review-list');
      const avgRatingEl = document.getElementById('average-rating');
      const sort = document.getElementById('sort-select').value;

      // sort
      reviews.sort((a, b) => {
        if (sort === 'latest')    return b.createdAt - a.createdAt;
        if (sort === 'oldest')    return a.createdAt - b.createdAt;
        if (sort === 'highest')   return b.rating - a.rating;
        if (sort === 'lowest')    return a.rating - b.rating;
        return 0;
      });

      reviewList.innerHTML = '';
      let total = 0, count = 0;

      reviews.forEach(r => {
        total += r.rating; count++;
        const box = document.createElement('div');
        box.className = 'review-box';
        box.innerHTML = `
          <div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
          <p class="review-text">“${r.text}”</p>
          <div class="review-author">— ${r.author}</div>
        `;
        reviewList.appendChild(box);
      });

      if (count) {
        const avg = (total/count).toFixed(1);
        const avgStars = '★'.repeat(Math.round(avg)) + '☆'.repeat(5 - Math.round(avg));
        avgRatingEl.innerHTML = `Average Rating: <strong>${avg}</strong> ${avgStars}`;
      } else {
        avgRatingEl.textContent = 'No reviews yet.';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadReviews();

      document.getElementById('sort-select').addEventListener('change', renderReviews);

      const modal = document.getElementById('review-modal');
      document.getElementById('add-review').addEventListener('click', () => modal.style.display = 'block');
      document.querySelector('.close-btn').addEventListener('click', () => modal.style.display = 'none');
      window.addEventListener('click', e => e.target === modal && (modal.style.display = 'none'));

      document.querySelectorAll('.star-input span').forEach(star => {
        star.addEventListener('click', () => {
          const rating = +star.dataset.value;
          document.getElementById('review-rating').value = rating;
          document.querySelectorAll('.star-input span').forEach(s =>
            s.classList.toggle('selected', +s.dataset.value <= rating)
          );
        });
      });

      document.getElementById('submit-review').addEventListener('click', async () => {
        const author = document.getElementById('review-author').value.trim();
        const rating = +document.getElementById('review-rating').value;
        const text = document.getElementById('review-text').value.trim();
        if (!author || !rating || !text) return alert('Please fill in all fields correctly.');
        const toast = document.createElement('div');
        toast.className = 'toast'; toast.textContent = 'Submitting review...';
        document.body.appendChild(toast);
        await addDoc(collection(db, 'reviews'), {
          author,
          rating,
          text,
          createdAt: serverTimestamp()
        });
        modal.style.display = 'none';
        loadReviews();
        toast.textContent = 'Thanks for your review!';
        setTimeout(() => toast.remove(), 3000);
      });
    });
  </script>
  <style>
    :root {
      --paper: #FAF3E7; --ink: #2B2420; --ink-soft: #6B5E52;
      --pine: #3F5D4E; --pine-dark: #26382F;
      --marigold: #DDA13B; --marigold-dark: #BD8527; --coral: #E2836B;
      --card: #FFFDF8; --border: #E3D2B0;
      --shadow-sm: 0 4px 14px rgba(43, 36, 32, 0.08);
      --shadow-md: 0 12px 30px rgba(43, 36, 32, 0.14);
      --radius: 18px;
    }
    * { box-sizing: border-box; }

    /* modal & form */
    .modal { display:none; position:fixed; z-index:200; left:0; top:0; width:100%; height:100%; background:rgba(43,36,32,0.5); }
    .modal-content { background: var(--card); margin:10% auto; padding:26px; border-radius: var(--radius); width:90%; max-width:400px; position:relative; box-shadow: var(--shadow-md); border: 1.5px solid var(--border); }
    .modal-content h2 { margin-top: 0; font-size: 1.4rem; }
    .close-btn { position:absolute; top:14px; right:18px; font-size:24px; cursor:pointer; color: var(--ink-soft); line-height: 1; }
    .close-btn:hover { color: var(--ink); }
    .modal-content input, .modal-content textarea {
      width:100%; padding:12px 14px; margin:8px 0; border:1.5px solid var(--border); border-radius:10px;
      font-family: 'Figtree', sans-serif; font-size: 1rem; background: var(--paper); color: var(--ink);
    }
    .modal-content input:focus, .modal-content textarea:focus { outline: none; border-color: var(--pine); box-shadow: 0 0 0 3px rgba(63,93,78,0.15); }
    #submit-review {
      background: var(--marigold); color:#2B2420; padding:13px 20px; border:none; border-radius:999px;
      cursor:pointer; font-weight: 700; font-size: 1rem; width: 100%; margin-top: 6px; transition: all 0.25s ease;
    }
    #submit-review:hover { background: var(--marigold-dark); transform: translateY(-2px); }

    /* global */
    body {
      margin:0; font-family:'Figtree',sans-serif; background: var(--paper);
      background-image: radial-gradient(circle at 12% 8%, rgba(63,93,78,0.06), transparent 40%),
                         radial-gradient(circle at 88% 92%, rgba(221,161,59,0.09), transparent 45%);
      color: var(--ink); text-align:center;
    }
    h1, h2, .display { font-family: 'Fraunces', serif; font-weight: 600; letter-spacing: -0.01em; }

    .site-nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 28px; background: var(--pine); box-shadow: var(--shadow-sm); }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .brand img { height: 44px; width: auto; display: block; }
    .brand span { font-family: 'Fraunces', serif; font-size: 1.25rem; font-weight: 600; color: #FCF4E4; }
    .nav-links { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .nav-links a { text-decoration: none; }
    .pill { display: inline-block; font-family: 'Figtree', sans-serif; font-weight: 600; font-size: 0.9rem; color: #FCF4E4; background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.18); padding: 9px 18px; border-radius: 999px; transition: all 0.25s ease; white-space: nowrap; }
    .pill:hover { background: rgba(255,255,255,0.18); transform: translateY(-2px); }
    .pill.current { background: var(--marigold); border-color: var(--marigold); color: #2B2420; }
    .cta-pill { background: linear-gradient(135deg, var(--marigold), #F0BE63, var(--marigold)); background-size: 200% 200%; color: #2B2420 !important; border: none !important; animation: shimmer 6s ease infinite; }
    @keyframes shimmer { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }

    main { padding: 56px 20px 40px; max-width: 900px; margin: 0 auto; }
    .page-head { margin-bottom: 30px; }
    .page-head h1 { font-size: clamp(2rem, 4.5vw, 2.6rem); margin: 0 0 10px; }
    .page-head p { color: var(--ink-soft); font-size: 1.05rem; margin: 0; }

    .filter-container { margin: 20px 0; display: flex; justify-content: center; align-items: center; gap: 10px; }
    #sort-select {
      padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 0.95rem;
      cursor: pointer; font-family: 'Figtree', sans-serif; background: var(--card); color: var(--ink);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    #sort-select:hover { border-color: var(--marigold); }

    #add-review {
      background: var(--marigold); color:#2B2420; padding:14px 28px; border:none; border-radius:999px;
      cursor:pointer; margin: 10px 0 30px; font-weight: 700; font-size: 1rem; box-shadow: var(--shadow-sm);
      transition: all 0.25s ease;
    }
    #add-review:hover { background: var(--marigold-dark); transform: translateY(-3px); box-shadow: var(--shadow-md); }

    .star-input { display:flex; justify-content:center; margin:10px 0; }
    .star-input span { font-size:1.6rem; cursor:pointer; color:#DDD1BC; margin:0 5px; transition: transform 0.3s ease, color 0.3s ease; }
    .star-input span.selected { color: var(--marigold); transform: scale(1.2); }

    #average-rating { font-size:1.15rem; margin-bottom:10px; color: var(--ink-soft); }
    #average-rating strong { color: var(--ink); }
    .loading { font-size:1.1rem; margin:20px 0; color: var(--ink-soft); }
    .review-list { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; }
    .review-box {
      background: var(--card); border:1.5px solid var(--border); border-radius: var(--radius);
      padding:22px; width:300px; box-shadow: var(--shadow-sm); text-align:left; transition: all 0.25s ease;
    }
    .review-box:hover { transform:translateY(-5px); box-shadow: var(--shadow-md); border-color: var(--marigold); }
    .stars { color: var(--marigold); font-size:1.15rem; margin-bottom:10px; }
    .review-text { font-size:1rem; line-height:1.55; margin-bottom:14px; color: var(--ink); }
    .review-author { font-weight:700; font-size:0.9rem; text-align:right; color: var(--pine-dark); }

    .toast {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background: var(--pine-dark);
      color:#F3E7D2; padding:12px 22px; border-radius:999px; box-shadow: var(--shadow-md); font-weight: 600;
    }

    .site-footer { margin-top: 40px; padding: 30px 20px 26px; text-align: center; background: var(--pine-dark); color: #F3E7D2; font-size: 0.92rem; }
    .paw-trail { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; opacity: 0.85; }
    .paw-trail svg { width: 16px; height: 16px; }

    @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; } }
    @media screen and (max-width: 720px) { .site-nav { flex-direction: column; align-items: stretch; gap: 10px; } .nav-links { justify-content: center; } }
    @media (max-width:640px) { .review-box { width:90%; } }
  </style>
</head>
<body>

  <header class="site-nav">
    <a class="brand" href="/">
      <img src="https://i.ibb.co/cK2khsFX/mewing-cat-removebg-preview-removebg-preview.png" alt="The Cat's Meow logo">
      <span>The Cat's Meow</span>
    </a>
    <nav class="nav-links">
      <a href="/"><span class="pill">Home</span></a>
      <a href="/about"><span class="pill">About</span></a>
      <a href="/services"><span class="pill">Services</span></a>
      <a href="/pricing"><span class="pill">Pricing</span></a>
      <a href="/reviews"><span class="pill current">Reviews</span></a>
      <a href="/contact"><span class="pill cta-pill">Book a Visit</span></a>
    </nav>
  </header>

  <main>
    <div class="page-head">
      <h1>What Our Clients Say</h1>
      <p>Real notes from neighbors who've trusted us with their cats.</p>
    </div>

    <div class="filter-container">
      <label for="sort-select">Sort by:</label>
      <select id="sort-select">
        <option value="latest">Latest</option>
        <option value="oldest">Oldest</option>
        <option value="highest">Highest Rating</option>
        <option value="lowest">Lowest Rating</option>
      </select>
    </div>

    <div id="average-rating"></div>
    <button id="add-review">Add Review</button>
    <div id="review-list" class="review-list"></div>
  </main>

  <div id="review-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2>Submit Your Review</h2>
      <input type="text" id="review-author" placeholder="Your Name">
      <div class="star-input">
        <span data-value="1">★</span>
        <span data-value="2">★</span>
        <span data-value="3">★</span>
        <span data-value="4">★</span>
        <span data-value="5">★</span>

      <input type="hidden" id="review-rating">
      <textarea id="review-text" placeholder="Write your review"></textarea>
      <button id="submit-review">Submit Review</button>

  </div>

      <svg viewBox="0 0 64 64" fill="#F3E7D2"><ellipse cx="32" cy="42" rx="16" ry="13"/><circle cx="14" cy="20" r="8"/><circle cx="32" cy="12" r="8.5"/><circle cx="50" cy="20" r="8"/></svg>
      <svg viewBox="0 0 64 64" fill="#F3E7D2"><ellipse cx="32" cy="42" rx="16" ry="13"/><circle cx="14" cy="20" r="8"/><circle cx="32" cy="12" r="8.5"/><circle cx="50" cy="20" r="8"/></svg>
    </div>
    <p>&copy; 2026 The Cat's Meow Highlands. All rights reserved.</p>
  </footer>

</body>
</html>
